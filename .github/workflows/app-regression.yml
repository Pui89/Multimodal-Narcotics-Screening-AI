name: Free local-first app regression checks

on:
  push:
    paths:
      - "apps/pui89_app/**"
      - "evaluation/**"
      - ".github/workflows/app-regression.yml"
  pull_request:
    paths:
      - "apps/pui89_app/**"
      - "evaluation/**"
      - ".github/workflows/app-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal API dependencies
        run: python -m pip install "fastapi>=0.110,<1.0" "pydantic>=2.6,<3.0"
      - name: Run API regression and evaluation metric tests
        run: python -m unittest apps.pui89_app.test_main evaluation.test_metrics -v
      - name: Smoke-test the synthetic evaluation runner
        run: python evaluation/run_evaluation.py evaluation/examples/synthetic_predictions.jsonl --output /tmp/synthetic-evaluation.json
