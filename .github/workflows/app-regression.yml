name: Free local-first app regression checks

on:
  push:
    paths:
      - "apps/pui89_app/**"
      - "evaluation/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/app-regression.yml"
  pull_request:
    paths:
      - "apps/pui89_app/**"
      - "evaluation/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/app-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal API dependencies
        run: python -m pip install "fastapi>=0.110,<1.0" "pydantic>=2.6,<3.0"
      - name: Syntax-check local dataset tooling
        run: python -m py_compile tools/audit_dataset_manifest.py tools/dataset_inventory.py tools/group_split_manifest.py
      - name: Run API regression and evaluation metric tests
        run: python -m unittest apps.pui89_app.test_main evaluation.test_metrics evaluation.test_runner -v
      - name: Run dataset provenance, split-leakage and path-safety tests
        run: python -m unittest discover -s tests -p "test_dataset_tools.py" -v
      - name: Smoke-test the synthetic evaluation runner
        run: |
          python evaluation/run_evaluation.py evaluation/examples/synthetic_predictions.jsonl --output /tmp/synthetic-evaluation.json
          python -c "import json; r=json.load(open('/tmp/synthetic-evaluation.json')); assert r['n']==6 and r['positive_label']=='review' and abs(r['accuracy']-2/3)<1e-9; print('synthetic pipeline smoke check passed; not a real-world benchmark')"
