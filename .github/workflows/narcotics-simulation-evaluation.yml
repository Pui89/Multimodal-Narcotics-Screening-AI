name: Multimodal Narcotics Screening AI Simulation Evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'simulation/**'
      - 'tools/pui89_autonomy_lab.py'
      - 'tools/pui89_evidence_benchmark.py'
      - 'tests/test_pui89_evidence_benchmark.py'
      - '.github/workflows/narcotics-simulation-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'simulation/**'
      - 'tools/pui89_autonomy_lab.py'
      - '.github/workflows/narcotics-simulation-evaluation.yml'

permissions:
  contents: read

concurrency:
  group: narcotics-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Hosted rule-based simulation and report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run simulation scenarios
        id: simulate
        run: |
          python tools/pui89_autonomy_lab.py simulate --config simulation/scenarios.json --output-dir reports/narcotics-simulation-run

      - name: Print report summary, including failures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("reports/narcotics-simulation-run").glob("simulation-report-*.json"))
          if not files:
              print("REPORT_NOT_FOUND: simulation may have failed before writing a report")
              raise SystemExit(0)
          report = json.loads(files[-1].read_text(encoding="utf-8"))
          print(json.dumps({
              "project_id": report.get("project_id"),
              "status": report.get("status"),
              "run_id": report.get("run_id"),
              "metrics": report.get("metrics"),
              "failures": report.get("failures", []),
              "hardware_actuation": False,
              "report_path": str(files[-1])
          }, indent=2))
          PY

      - name: Build evidence benchmark and verify report integrity
        run: |
          python -m unittest discover -s tests -p 'test_pui89_evidence_benchmark.py' -v
          REPORT=$(find reports/narcotics-simulation-run -maxdepth 1 -name 'simulation-report-*.json' -print -quit)
          test -n "$REPORT"
          python tools/pui89_evidence_benchmark.py --report "$REPORT" --output reports/pui89-evidence-benchmark.json

      - name: Upload JSON and CSV reports, including failure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: narcotics-simulation-report-${{ github.run_id }}
          path: reports/narcotics-simulation-run/
          if-no-files-found: warn
          retention-days: 14
