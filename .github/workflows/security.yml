name: Security Checks
on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "SECURITY.md"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "SECURITY.md"
  schedule:
    - cron: "51 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan for obvious credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.svg' '(BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' .; then
            echo "Potential secret material detected."
            exit 1
          fi

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install security tooling in the ephemeral runner
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --disable-pip-version-check bandit pip-audit
      - name: Audit installed dependencies
        run: pip-audit
      - name: Static security analysis
        run: bandit -r src -ll

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4
        with:
          languages: python, actions
      - uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4
