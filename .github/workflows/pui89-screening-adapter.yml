name: Screening Shared AI Core v0.1 Adapter Checks
on:
  push:
    paths:
      - "tools/pui89_screening_model_adapter.py"
      - "tools/pui89_shared_core_v01.py"
      - "tools/pui89_project_adapter_common.py"
      - "tests/test_pui89_screening_model_adapter.py"
      - "tests/test_pui89_shared_core_v01.py"
      - ".github/workflows/pui89-screening-adapter.yml"
  pull_request:
    paths:
      - "tools/pui89_screening_model_adapter.py"
      - "tools/pui89_shared_core_v01.py"
      - "tools/pui89_project_adapter_common.py"
      - "tests/test_pui89_screening_model_adapter.py"
      - "tests/test_pui89_shared_core_v01.py"
      - ".github/workflows/pui89-screening-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screening-shared-core-adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Screening project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Shared AI Core schemas
        uses: actions/checkout@v4
        with:
          repository: Pui89/PUI89-Shared-AI-Core
          ref: e762f38f1e34ddf2ce9e22e12605bc08aa493ff9
          path: shared-ai-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run existing Screening adapter tests
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tests -p "test_pui89_screening_model_adapter.py" -v
      - name: Check Screening mapping against pinned Shared AI Core v0.1
        env:
          PYTHONPATH: tools
          PUI89_SHARED_CORE_DIR: shared-ai-core
        run: python -m unittest discover -s tests -p "test_pui89_shared_core_v01.py" -v
