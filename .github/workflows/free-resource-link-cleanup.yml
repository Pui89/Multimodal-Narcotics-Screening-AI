name: Free resource review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-resource-review
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit free-resource links and catalogue entries
        env:
          LINK_AUDIT_FILES: |
            docs/FREE_FIRST_RESOURCE_CATALOGUE.md
        run: python .github/scripts/audit_free_resource_links.py
      - name: Publish audit summary without modifying repository files
        run: |
          if [ -f FREE_RESOURCE_LINK_AUDIT.md ]; then
            cat FREE_RESOURCE_LINK_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit completed; no Markdown report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
