name: Multimodal Screening AI regression checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/screening-regression.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/screening-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run repository tests
        run: python -m pytest tests/ -q
