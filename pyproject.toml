[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'pui89-sentinel-quadruped'
version = '0.1.0'
description = 'PUI89 Sentinel quadruped exploration and inspection software foundations'
requires-python = '>=3.10'
dependencies = []

[project.optional-dependencies]
dev = ['pytest>=8']

[tool.pytest.ini_options]
pythonpath = ['src', 'apps']
testpaths = ['tests']
