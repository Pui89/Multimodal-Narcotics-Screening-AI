[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'multimodal-narcotics-screening-robot'
version = '0.2.0'
description = 'Defensive multimodal screening and safe robotics platform'
requires-python = '>=3.10'
dependencies = []

[project.optional-dependencies]
dev = ['pytest>=8']

[tool.pytest.ini_options]
pythonpath = ['.', 'src']
testpaths = ['tests']
