<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Multimodal Narcotics Screening AI — Robot Concept</title>
<desc id="desc">Illustrative design concept showing an inspection robot, baggage screening area, sensor inputs, an evidence dashboard, and mandatory human review.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#122e48"/></linearGradient>
  <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7f2f7"/><stop offset="1" stop-color="#8faab9"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter>
  <style>
    .heading{font:700 34px Arial,sans-serif;fill:#f3f8fc}.sub{font:400 17px Arial,sans-serif;fill:#a9c3d4}
    .label{font:700 16px Arial,sans-serif;fill:#e8f5fc}.small{font:400 13px Arial,sans-serif;fill:#aac3d3}
    .tiny{font:400 11px Arial,sans-serif;fill:#9db8c9}.green{fill:#8be0bd}.amber{fill:#ffc66d}
    .line{fill:none;stroke:#42d7e8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#102a40;stroke:#294b62;stroke-width:1.5}.pill{fill:#153e53;stroke:#2e7185;stroke-width:1}
  </style>
</defs>
