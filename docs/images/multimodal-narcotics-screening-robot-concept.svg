</g>
<path d="M351 282 L440 260 L470 290" class="line" opacity=".75"/><path d="M345 292 L455 330 L515 330" class="line" opacity=".55" stroke-dasharray="6 7"/><path d="M345 375 L515 395 L578 395" class="line" opacity=".55" stroke-dasharray="6 7"/>
<rect x="80" y="280" width="150" height="78" rx="12" fill="#0b2031" stroke="#2e6176"/><text x="98" y="306" class="label">Sensor mast</text><text x="98" y="328" class="small">RGB / depth</text><text x="98" y="346" class="small">LiDAR (optional)</text><path d="M230 320 L267 292" class="line"/>
<rect x="465" y="510" width="110" height="55" rx="10" fill="#0b2031" stroke="#2e6176"/><text x="520" y="532" text-anchor="middle" class="small">Baggage</text><text x="520" y="549" text-anchor="middle" class="small">handoff zone</text><path d="M575 537 L602 507" class="line"/>
<text x="82" y="643" class="small">Low-speed mobility • obstacle sensing • physical emergency stop</text>
<rect x="980" y="180" width="565" height="520" rx="22" class="panel"/><text x="1008" y="220" class="label">02 / OPERATOR DASHBOARD</text><text x="1008" y="245" class="small">Evidence summary — sample UI, not live data</text>
<rect x="1007" y="265" width="510" height="56" rx="10" fill="#0b1f30" stroke="#294e63"/><circle cx="1032" cy="293" r="7" fill="#8be0bd"/><text x="1050" y="289" class="small">Sensor health</text><text x="1050" y="307" class="tiny">Example inputs received</text><rect x="1360" y="281" width="136" height="25" rx="12" fill="#174c43"/><text x="1428" y="298" text-anchor="middle" class="small green">CHECK COMPLETE</text>
<text x="1010" y="353" class="small">INPUT STATUS</text>
<rect x="1008" y="365" width="242" height="52" rx="9" fill="#0b1f30" stroke="#294e63"/><circle cx="1028" cy="391" r="5" fill="#42d7e8"/><text x="1042" y="387" class="label">RGB camera</text><text x="1042" y="404" class="tiny">Illustrative visual input</text>
<rect x="1265" y="365" width="252" height="52" rx="9" fill="#0b1f30" stroke="#294e63"/><circle cx="1285" cy="391" r="5" fill="#42d7e8"/><text x="1299" y="387" class="label">Depth / geometry</text><text x="1299" y="404" class="tiny">Optional configured sensor</text>
<rect x="1008" y="427" width="242" height="52" rx="9" fill="#0b1f30" stroke="#294e63"/><circle cx="1028" cy="453" r="5" fill="#ffc66d"/><text x="1042" y="449" class="label">Thermal / NIR</text><text x="1042" y="466" class="tiny">Optional — not assumed</text>
<rect x="1265" y="427" width="252" height="52" rx="9" fill="#0b1f30" stroke="#294e63"/><circle cx="1285" cy="453" r="5" fill="#ffc66d"/><text x="1299" y="449" class="label">X-ray / CT</text><text x="1299" y="466" class="tiny">Separate authorized system</text>
<rect x="1008" y="493" width="509" height="76" rx="10" fill="#31291b" stroke="#87673a"/><text x="1028" y="518" class="label amber">SCREENING STATUS: UNKNOWN / REVIEW</text><text x="1028" y="540" class="small">Insufficient evidence is not a positive finding.</text><text x="1028" y="557" class="tiny">No chemical identity inferred from appearance.</text>
<rect x="1008" y="583" width="509" height="84" rx="10" fill="#123a35" stroke="#337a69"/><text x="1028" y="609" class="label green">HUMAN REVIEW REQUIRED</text><text x="1028" y="632" class="small">Authorized operator checks evidence and context.</text><text x="1028" y="651" class="small">AI has no authority to accuse or enforce.</text>
<rect x="55" y="725" width="1490" height="195" rx="22" class="panel"/><text x="82" y="765" class="label">03 / SAFETY-FIRST WORKFLOW</text><text x="82" y="790" class="small">Each stage records missing inputs and uncertainty; robot motion stays on a separate safety-controlled path.</text>
<rect x="82" y="817" width="180" height="67" rx="11" fill="#123b50" stroke="#2e7185"/><text x="172" y="844" text-anchor="middle" class="label">Sense</text><text x="172" y="865" text-anchor="middle" class="tiny">Authorized data</text><path d="M265 850 H294 M288 844 L296 850 L288 856" class="line"/>
<rect x="300" y="817" width="180" height="67" rx="11" fill="#123b50" stroke="#2e7185"/><text x="390" y="844" text-anchor="middle" class="label">Quality gate</text><text x="390" y="865" text-anchor="middle" class="tiny">Health / timestamps</text><path d="M483 850 H512 M506 844 L514 850 L506 856" class="line"/>
<rect x="518" y="817" width="180" height="67" rx="11" fill="#123b50" stroke="#2e7185"/><text x="608" y="844" text-anchor="middle" class="label">Evidence fusion</text><text x="608" y="865" text-anchor="middle" class="tiny">Agreement / conflict</text><path d="M701 850 H730 M724 844 L732 850 L724 856" class="line"/>
<rect x="736" y="817" width="180" height="67" rx="11" fill="#3a301d" stroke="#8c6b3b"/><text x="826" y="844" text-anchor="middle" class="label amber">Uncertainty</text><text x="826" y="865" text-anchor="middle" class="tiny">UNKNOWN if unclear</text><path d="M919 850 H948 M942 844 L950 850 L942 856" class="line"/>
<rect x="954" y="817" width="180" height="67" rx="11" fill="#123b50" stroke="#2e7185"/><text x="1044" y="844" text-anchor="middle" class="label">Human review</text><text x="1044" y="865" text-anchor="middle" class="tiny">Authorized decision</text><path d="M1137 850 H1166 M1160 844 L1168 850 L1160 856" class="line"/>
<rect x="1172" y="817" width="180" height="67" rx="11" fill="#123b50" stroke="#2e7185"/><text x="1262" y="844" text-anchor="middle" class="label">Audit record</text><text x="1262" y="865" text-anchor="middle" class="tiny">Provenance / outcome</text>
<rect x="1370" y="817" width="145" height="67" rx="11" fill="#16372f" stroke="#3a806b"/><text x="1442" y="842" text-anchor="middle" class="label green">Safe motion</text><text x="1442" y="862" text-anchor="middle" class="tiny">Separate control</text>
<text x="64" y="962" class="tiny">CONCEPT ONLY • Sensor options depend on installed hardware • Not a validated detector • No autonomous enforcement • Use lawful data and validated procedures</text><text x="1535" y="962" text-anchor="end" class="tiny">PUI89 / MULTIMODAL SCREENING AI</text>
</svg>