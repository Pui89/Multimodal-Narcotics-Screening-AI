<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Multimodal Screening AI animated concept demo</title><desc id="desc">Concept dashboard showing illustrative RGB, depth, thermal, and spectral evidence streams, an uncertainty indicator, and mandatory human review.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#1b2146"/><stop offset="1" stop-color="#0a1129"/></linearGradient><linearGradient id="scan" x2="1"><stop stop-color="#49e5cf" stop-opacity="0"/><stop offset=".5" stop-color="#49e5cf" stop-opacity=".9"/><stop offset="1" stop-color="#49e5cf" stop-opacity="0"/></linearGradient></defs>
<rect width="960" height="540" rx="24" fill="url(#bg)"/><text x="38" y="48" fill="#8ef4e4" font-family="Arial" font-size="17" letter-spacing="2">AI APPLICATION / CONCEPT SIMULATION</text><text x="38" y="88" fill="white" font-family="Arial" font-size="28" font-weight="700">Multimodal Screening AI</text>
<rect x="35" y="115" width="610" height="385" rx="18" fill="#141e3d" stroke="#414e83"/><text x="58" y="149" fill="#dce5ff" font-family="Arial" font-size="15" font-weight="700">ILLUSTRATIVE SENSOR EVIDENCE</text>
<g><rect x="55" y="170" width="270" height="120" rx="10" fill="#253c53" stroke="#4e8096"/><text x="70" y="192" fill="#a8ddec" font-family="Arial" font-size="13">RGB / VISUAL</text><rect x="105" y="208" width="165" height="55" rx="8" fill="#415d70"/><rect x="157" y="218" width="58" height="35" rx="5" fill="#d0d8dc"/><rect x="164" y="224" width="44" height="23" rx="3" fill="#91a7b2"/><rect x="55" y="170" width="270" height="120" rx="10" fill="url(#scan)" opacity=".5"><animate attributeName="y" values="170;260;170" dur="3s" repeatCount="indefinite"/></rect></g>
<g><rect x="345" y="170" width="270" height="120" rx="10" fill="#222b50" stroke="#5d6aaf"/><text x="360" y="192" fill="#bfcaff" font-family="Arial" font-size="13">DEPTH / GEOMETRY</text><g fill="#6475bb"><rect x="375" y="211" width="25" height="12"/><rect x="405" y="211" width="25" height="12"/><rect x="435" y="211" width="25" height="12"/><rect x="465" y="211" width="25" height="12"/><rect x="495" y="211" width="25" height="12"/><rect x="375" y="227" width="25" height="12"/><rect x="405" y="227" width="25" height="12"/><rect x="435" y="227" width="25" height="12"/><rect x="465" y="227" width="25" height="12"/><rect x="495" y="227" width="25" height="12"/><rect x="375" y="243" width="25" height="12"/><rect x="405" y="243" width="25" height="12"/><rect x="435" y="243" width="25" height="12"/><rect x="465" y="243" width="25" height="12"/><rect x="495" y="243" width="25" height="12"/></g><circle cx="530" cy="231" r="22" fill="none" stroke="#8ef4e4" stroke-width="2"><animate attributeName="r" values="18;28;18" dur="2s" repeatCount="indefinite"/></circle></g>
<g><rect x="55" y="305" width="270" height="120" rx="10" fill="#372c51" stroke="#936eaa"/><text x="70" y="327" fill="#e2c6ff" font-family="Arial" font-size="13">THERMAL / IR</text><path d="M75 385 Q105 350 130 383 T185 375 T240 390 T305 367" fill="none" stroke="#ffb56b" stroke-width="5"><animate attributeName="stroke-width" values="3;7;3" dur="2.5s" repeatCount="indefinite"/></path><g fill="#ff8d8d"><circle cx="124" cy="368" r="7"/><circle cx="226" cy="378" r="9"/></g></g>
<g><rect x="345" y="305" width="270" height="120" rx="10" fill="#183e4a" stroke="#4f9c9d"/><text x="360" y="327" fill="#9ff5eb" font-family="Arial" font-size="13">SPECTRAL / OTHER</text><path d="M365 392 L390 392 L410 354 L430 392 L454 376 L476 392 L500 340 L525 392 L550 365 L575 392 L595 392" fill="none" stroke="#61dfca" stroke-width="3"><animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></path></g>
<path d="M190 438 V454 H480 V438 M480 454 H755" fill="none" stroke="#8ef4e4" stroke-width="2" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></path>
<rect x="672" y="115" width="253" height="385" rx="18" fill="#111a37" stroke="#414e83"/><text x="697" y="151" fill="#e3e9ff" font-family="Arial" font-size="17" font-weight="700">REVIEW WORKSPACE</text>
<text x="697" y="194" fill="#a8b5dd" font-family="Arial" font-size="13">Sensor health (illustrative)</text><rect x="697" y="207" width="202" height="9" rx="4" fill="#293255"/><rect x="697" y="207" width="170" height="9" rx="4" fill="#55d8bd"><animate attributeName="width" values="145;190;170" dur="3s" repeatCount="indefinite"/></rect>
<text x="697" y="250" fill="#a8b5dd" font-family="Arial" font-size="13">Model output</text><rect x="697" y="263" width="202" height="42" rx="9" fill="#30304d"/><text x="798" y="289" fill="#ffe09a" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">UNKNOWN / REVIEW</text>
<text x="697" y="340" fill="#a8b5dd" font-family="Arial" font-size="13">Decision safeguard</text><rect x="697" y="353" width="202" height="55" rx="9" fill="#263f50"/><circle cx="717" cy="380" r="7" fill="#ffcf70"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="734" y="376" fill="#fff0c5" font-family="Arial" font-size="12">No automated accusation</text><text x="734" y="392" fill="#fff0c5" font-family="Arial" font-size="12">Human verification required</text>
<text x="697" y="448" fill="#a8b5dd" font-family="Arial" font-size="12">Evidence fusion → uncertainty</text><text x="697" y="466" fill="#a8b5dd" font-family="Arial" font-size="12">→ auditable human decision</text>
<text x="38" y="525" fill="#a8b5dd" font-family="Arial" font-size="12">ANIMATED CONCEPT ONLY • NOT A VALIDATED DETECTOR • HUMAN REVIEW REQUIRED</text></svg>