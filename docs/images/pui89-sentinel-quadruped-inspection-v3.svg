<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Sentinel — Quadruped All-Terrain Inspection Robot Dog, concept v3</title>
<desc id="desc">A newly drawn industrial quadruped inspection robot dog in deep navy, titanium silver and electric cyan. Four articulated legs with visible hip, knee and foot joints support a compact armored body. A forward sensor head carries RGB and depth cameras; a raised 360-degree lidar module sits above the body. Industrial inspection site background. Concept illustration only, not a built or validated robot.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10263a"/><stop offset=".55" stop-color="#091827"/><stop offset="1" stop-color="#050d17"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#1b9dbb" stop-opacity=".28"/><stop offset="1" stop-color="#071522" stop-opacity="0"/></radialGradient>
 <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8e4ec"/><stop offset=".22" stop-color="#607b90"/><stop offset=".52" stop-color="#213a50"/><stop offset="1" stop-color="#0a1828"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36536b"/><stop offset=".48" stop-color="#142b40"/><stop offset="1" stop-color="#071421"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#f1f7fb"/><stop offset=".4" stop-color="#9eb2c1"/><stop offset="1" stop-color="#526b7f"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087ca5"/><stop offset=".5" stop-color="#35d5f5"/><stop offset="1" stop-color="#b5f7ff"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7f4ff"/><stop offset=".35" stop-color="#238fb4"/><stop offset="1" stop-color="#071725"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#4c7893" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
<ellipse cx="835" cy="475" rx="700" ry="470" fill="url(#halo)"/>
