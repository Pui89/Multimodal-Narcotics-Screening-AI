  <ellipse cx="1228" cy="694" rx="130" ry="24" fill="#020b13" opacity=".45" filter="url(#shadow)"/>
  <rect x="1148" y="552" width="155" height="140" rx="20" fill="#c58b54" stroke="#f0c18b" stroke-width="4"/>
  <path d="M1190 552V533Q1190 516 1207 516H1243Q1260 516 1260 533V552" fill="none" stroke="#e8bb86" stroke-width="9"/>
  <path d="M1181 573V670M1270 573V670" stroke="#9b643a" stroke-width="5"/>
  <rect x="1207" y="611" width="35" height="25" rx="5" fill="#8b5735"/>
  <circle cx="1175" cy="697" r="10" fill="#142c3a"/><circle cx="1278" cy="697" r="10" fill="#142c3a"/>
  <!-- robot shadow -->
  <ellipse cx="670" cy="740" rx="250" ry="42" fill="#020b13" opacity=".5" filter="url(#shadow)"/>
