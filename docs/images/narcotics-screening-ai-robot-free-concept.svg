<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal Narcotics Screening AI Robot — Free Concept Artwork</title>
  <desc id="desc">Original vector concept illustration of a supervised mobile inspection robot at a controlled baggage screening checkpoint. It uses cameras and non-invasive sensor modules, displays an uncertainty-aware review status, and leaves decisions to an authorized human operator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081729"/><stop offset="1" stop-color="#153c54"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8fb"/><stop offset="1" stop-color="#b9cad7"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#50e1db"/><stop offset="1" stop-color="#167b99"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18384c"/><stop offset="1" stop-color="#294b5e"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".13" stroke="#9bd7e4" stroke-width="2"><path d="M0 140H1600M0 230H1600M0 320H1600M0 410H1600M0 500H1600M0 590H1600M0 680H1600"/><path d="M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900M1200 0V900M1320 0V900M1440 0V900"/></g>
  <circle cx="1230" cy="165" r="190" fill="#2e8798" opacity=".13"/><circle cx="1230" cy="165" r="125" fill="none" stroke="#58c9d0" stroke-width="2" opacity=".25"/>
  <text x="84" y="86" fill="#69e0dc" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">OPEN CONCEPT • FREE ORIGINAL VECTOR ART</text>
  <text x="80" y="145" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700">MULTIMODAL SCREENING ROBOT</text>
  <text x="83" y="185" fill="#b8d3df" font-family="Arial, sans-serif" font-size="22">Supervised checkpoint assistant · human-led decisions</text>
  <!-- checkpoint backdrop -->
  <path d="M0 685 L1600 595 V900H0Z" fill="url(#floor)"/>
  <path d="M0 744 L1600 655" stroke="#4a7a8b" stroke-width="3" opacity=".55"/>
  <path d="M0 817 L1600 729" stroke="#4a7a8b" stroke-width="3" opacity=".4"/>
  <!-- distant checkpoint frame -->
  <g opacity=".55" fill="none" stroke="#6c9dad" stroke-width="12">
    <path d="M1010 300V615M1335 280V598M1010 300H1335"/>
    <path d="M1042 332H1305V574H1042Z" stroke-width="3" stroke-dasharray="10 10"/>
  </g>
  <rect x="1050" y="350" width="245" height="180" rx="16" fill="#0b1d2d" stroke="#3c8295" stroke-width="3"/>
  <text x="1172" y="385" fill="#a4dce5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">CONTROLLED CHECKPOINT</text>
  <rect x="1080" y="406" width="185" height="78" rx="8" fill="#173e51"/>
  <path d="M1095 463L1122 438L1145 450L1174 421L1200 442L1222 427L1250 452" fill="none" stroke="#55d4d2" stroke-width="4"/>
  <text x="1172" y="510" fill="#d3e8ee" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">SCAN ZONE</text>
