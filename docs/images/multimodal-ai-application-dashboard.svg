  <rect class="card" x="420" y="190" width="360" height="112" rx="16"/>
  <rect class="card" x="800" y="190" width="360" height="112" rx="16"/>
  <rect class="card" x="1180" y="190" width="380" height="112" rx="16"/>
</g>
<g>
 <text x="64" y="222" class="muted small">SENSOR HEALTH</text><text x="64" y="264" class="txt" font-size="31" font-weight="700">4 / 4</text><text x="177" y="263" class="green small">feeds available</text><rect x="64" y="280" width="306" height="5" rx="3" fill="#23384d"/><rect x="64" y="280" width="280" height="5" rx="3" fill="#4de0c1"/>
 <text x="444" y="222" class="muted small">EVIDENCE STREAMS</text><text x="444" y="264" class="txt" font-size="31" font-weight="700">RGB · DEPTH</text><text x="444" y="285" class="muted small">Thermal/NIR · LiDAR</text>
 <text x="824" y="222" class="muted small">UNCERTAINTY STATUS</text><text x="824" y="264" class="txt" font-size="31" font-weight="700">Explicit</text><text x="948" y="263" class="amber small">abstain when unsure</text>
 <text x="1204" y="222" class="muted small">CASE DECISION</text><text x="1204" y="264" class="txt" font-size="31" font-weight="700">Review required</text><text x="1204" y="285" class="muted small">No automated enforcement decision</text>
</g>
