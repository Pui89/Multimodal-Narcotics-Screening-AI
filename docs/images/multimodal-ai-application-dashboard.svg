<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Multimodal Narcotics Screening AI Application Dashboard Concept</title>
<desc id="desc">A polished dark dashboard concept showing sensor health, multimodal evidence fusion, uncertainty, a human review queue and an audit trail. It is a UI concept, not a validated detection system.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081322"/><stop offset="1" stop-color="#14253b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d6c3"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d6c3" stop-opacity=".24"/><stop offset="1" stop-color="#5b8cff" stop-opacity=".02"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".22"/></filter>
  <style>
    .txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5ff}.muted{fill:#91a7c3;font-family:Inter,Segoe UI,Arial,sans-serif}.small{font-size:15px}.label{font-size:17px;font-weight:600}.card{fill:#101f32;stroke:#2b405b;stroke-width:1.5}.line{stroke:#2a405b;stroke-width:1.5}.green{fill:#4de0c1}.blue{fill:#76a8ff}.amber{fill:#ffc66e}
  </style>
</defs>
<rect width="1600" height="1000" rx="28" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="92" rx="28" fill="#0b1728"/>
<rect x="0" y="64" width="1600" height="28" fill="#0b1728"/>
<g transform="translate(38 26)">
  <rect width="42" height="42" rx="12" fill="url(#accent)"/>
  <path d="M11 22h20M21 12v20M14 15l14 14M28 15L14 29" stroke="#061727" stroke-width="2.6" stroke-linecap="round"/>
  <text x="58" y="19" class="txt" font-size="22" font-weight="700">PUI89 / MULTIMODAL SCREENING</text>
  <text x="58" y="41" class="muted" font-size="14">AI APPLICATION CONCEPT • RESEARCH WORKSPACE</text>
</g>
<g transform="translate(1230 28)">
  <circle cx="8" cy="9" r="5" fill="#4de0c1"/><text x="22" y="14" class="muted small">SYSTEM DEMO / SIMULATED</text>
