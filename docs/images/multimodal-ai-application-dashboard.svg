<text x="40" y="785" class="txt" font-size="22" font-weight="700">Designed for accountable AI workflows</text>
<g transform="translate(40 810)">
 <rect width="360" height="92" rx="14" fill="#102235" stroke="#2b405b"/><text x="22" y="31" class="green label">01 / SENSE</text><text x="22" y="57" class="muted small">Quality checks and synchronized feeds</text><text x="22" y="77" class="muted small">Missing data remains explicitly missing</text>
 <rect x="380" width="360" height="92" rx="14" fill="#102235" stroke="#2b405b"/><text x="402" y="31" class="blue label">02 / REASON</text><text x="402" y="57" class="muted small">Fuse evidence and quantify uncertainty</text><text x="402" y="77" class="muted small">Preserve UNKNOWN when evidence is weak</text>
 <rect x="760" width="360" height="92" rx="14" fill="#102235" stroke="#2b405b"/><text x="782" y="31" class="amber label">03 / REVIEW</text><text x="782" y="57" class="muted small">Authorized human decision and audit</text><text x="782" y="77" class="muted small">No automated enforcement decisions</text>
 <rect x="1140" width="380" height="92" rx="14" fill="#102235" stroke="#2b405b"/><text x="1162" y="31" class="txt label">RESEARCH PROTOTYPE</text><text x="1162" y="57" class="muted small">Illustrative dashboard and synthetic data</text><text x="1162" y="77" class="muted small">Not validated chemical detection</text>
</g>
<text x="40" y="950" class="muted" font-size="14">PUI89 • Multimodal Narcotics Screening AI • UI concept artwork only — not evidence of operational performance.</text>
