</g>
<text x="40" y="137" class="txt" font-size="27" font-weight="700">Screening Intelligence Console</text>
<text x="40" y="165" class="muted" font-size="16">Sensor-aware evidence fusion · Open-set uncertainty · Traceable decisions</text>
<!-- metric cards -->
<g filter="url(#shadow)">
