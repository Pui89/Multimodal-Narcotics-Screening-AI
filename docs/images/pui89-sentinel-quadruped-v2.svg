 <radialGradient id="aura"><stop stop-color="#42d9ff" stop-opacity=".22"/><stop offset="1" stop-color="#42d9ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce6ee"/><stop offset=".22" stop-color="#71869b"/><stop offset=".52" stop-color="#263b52"/><stop offset=".8" stop-color="#101f33"/><stop offset="1" stop-color="#52677d"/></linearGradient>
 <linearGradient id="darkArmor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b5269"/><stop offset=".42" stop-color="#14283d"/><stop offset="1" stop-color="#081522"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f1f6fa"/><stop offset=".3" stop-color="#aab9c7"/><stop offset=".72" stop-color="#52677b"/><stop offset="1" stop-color="#26394d"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087eaa"/><stop offset=".45" stop-color="#42d9ff"/><stop offset="1" stop-color="#b3f3ff"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ef0ff"/><stop offset=".25" stop-color="#1b8db4"/><stop offset=".7" stop-color="#09243a"/><stop offset="1" stop-color="#06111e"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9bc9dc" stroke-opacity=".055" stroke-width="1"/></pattern>
