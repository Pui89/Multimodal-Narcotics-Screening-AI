<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Sentinel — All-Terrain Inspection Robot Dog</title>
<desc id="desc">A premium industrial quadruped inspection robot concept in deep navy, titanium silver and electric cyan, with articulated legs, protected joints, a forward stereo camera head and a raised panoramic sensor mast, standing on rugged terrain.</desc>
<defs>
