<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Multimodal Narcotics Screening AI — inspection robot concept</title><desc id="desc">Original concept illustration of a mobile inspection robot and separate authorized screening station with cameras, depth sensing, an operator review console and explicit unknown or human review states. Not a validated narcotics detector.</desc>
