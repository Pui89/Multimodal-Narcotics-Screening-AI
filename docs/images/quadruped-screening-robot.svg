 <path d="M700 525L770 575L805 667" fill="none" stroke="#283945" stroke-width="43"/><path d="M700 525L770 575L805 667" fill="none" stroke="url(#shell)" stroke-width="29"/>
 <path d="M800 490L870 540L895 620" fill="none" stroke="#283945" stroke-width="43"/><path d="M800 490L870 540L895 620" fill="none" stroke="url(#shell)" stroke-width="29"/>
 <g fill="#1e303c" stroke="#7d8d98" stroke-width="5"><circle cx="430" cy="520" r="24"/><circle cx="570" cy="545" r="25"/><circle cx="700" cy="525" r="24"/><circle cx="800" cy="490" r="24"/></g>
 <g fill="#172631"><path d="M312 676Q340 660 366 677L371 697L310 697Z"/><path d="M522 696Q550 678 577 698L581 716L517 716Z"/><path d="M776 666Q805 648 832 668L837 687L772 687Z"/><path d="M866 620Q895 603 920 622L924 640L863 640Z"/></g>
</g>
