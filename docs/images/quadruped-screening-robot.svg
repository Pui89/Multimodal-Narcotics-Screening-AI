<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 quadruped mobile screening robot concept</title>
<desc id="desc">Engineering concept illustration of a compact four-legged robot with lidar, depth camera, replaceable chemical sensor module and emergency stop, in an airport terminal with walking passengers.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf3f7"/><stop offset="1" stop-color="#cbd7e0"/></linearGradient>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbfc"/><stop offset=".45" stop-color="#9eacb7"/><stop offset="1" stop-color="#52616d"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#445562"/><stop offset="1" stop-color="#172631"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53e0d0"/><stop offset="1" stop-color="#087f89"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<g opacity=".65" stroke="#a5b5c0" stroke-width="2"><path d="M0 170H1400M0 260H1400M0 350H1400"/><path d="M110 0L350 490M420 0L520 490M730 0L690 490M1040 0L850 490M1330 0L1010 490"/></g>
<rect x="0" y="490" width="1400" height="410" fill="#9aaab5"/>
