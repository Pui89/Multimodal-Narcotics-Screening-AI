<rect x="498" y="280" width="49" height="24" rx="8" fill="#243744"/><ellipse cx="522" cy="280" rx="25" ry="9" fill="#657884"/><ellipse cx="522" cy="278" rx="17" ry="5" fill="#65e6d9"/>
<!-- chemical sensor cartridge -->
<rect x="600" y="395" width="91" height="48" rx="9" fill="#263b47" stroke="#8296a2" stroke-width="3"/><rect x="611" y="405" width="69" height="26" rx="5" fill="#0f252f"/><path d="M620 417h50" stroke="#54e2d2" stroke-width="3"/><circle cx="674" cy="418" r="4" fill="#ffd166"/>
