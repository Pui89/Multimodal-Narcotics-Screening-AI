<path d="M493 397L500 333L535 334L539 402Z" fill="url(#dark)" stroke="#263944" stroke-width="4"/>
<rect x="477" y="302" width="88" height="50" rx="12" fill="url(#shell)" stroke="#31434f" stroke-width="5"/>
<rect x="490" y="314" width="61" height="23" rx="7" fill="#172631"/>
<circle cx="505" cy="325" r="7" fill="#4be3dc"/><circle cx="530" cy="325" r="7" fill="#63a8ff"/>
