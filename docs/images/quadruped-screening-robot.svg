<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">PUI89 SENTINEL mobile inspection robot — 3D concept illustration</title>
<desc id="d">A proposed four-legged navy and brushed-metal mobile inspection assistant with a 360-degree sensor mast, forward RGB and depth cameras, protected modular sensor bay, emergency stop, and human reviewer station in a modern transport terminal. Concept only; no detection capability is implied.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#1a5471" stop-opacity=".65"/><stop offset="1" stop-color="#07111f" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f7fb"/><stop offset=".3" stop-color="#91a7b9"/><stop offset=".65" stop-color="#d9e5ee"/><stop offset="1" stop-color="#60788d"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#29435e"/><stop offset=".55" stop-color="#14283e"/><stop offset="1" stop-color="#091827"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8f2ff"/><stop offset=".45" stop-color="#42d9ff"/><stop offset="1" stop-color="#0786b6"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
