<g opacity=".65" fill="#50616d"><rect x="75" y="370" width="360" height="16" rx="8"/><rect x="1010" y="155" width="275" height="14" rx="7"/></g>
<!-- walking passengers, deliberately generic silhouettes -->
<g transform="translate(1040 315)" opacity=".75"><ellipse cx="20" cy="25" rx="24" ry="28" fill="#6e7d88"/><path d="M-8 58Q18 42 43 61L51 150L-15 150Z" fill="#465864"/><path d="M0 146L-12 242L10 242L25 158L38 242L61 242L45 145Z" fill="#344550"/><path d="M-6 70L-42 132L-30 143L8 100M41 70L67 123L54 133L27 99" fill="none" stroke="#465864" stroke-width="16" stroke-linecap="round"/><rect x="-57" y="123" width="30" height="42" rx="4" fill="#2b4655"/></g>
<g transform="translate(1200 350) scale(.82)" opacity=".55"><ellipse cx="20" cy="25" rx="24" ry="28" fill="#6e7d88"/><path d="M-8 58Q18 42 43 61L51 150L-15 150Z" fill="#6b7e89"/><path d="M0 146L-12 242L10 242L25 158L38 242L61 242L45 145Z" fill="#344550"/><path d="M-6 70L-42 132L-30 143L8 100M41 70L67 123L54 133L27 99" fill="none" stroke="#6b7e89" stroke-width="16" stroke-linecap="round"/></g>
<!-- robot shadow -->
<ellipse cx="585" cy="688" rx="320" ry="55" fill="#253744" opacity=".25" filter="url(#shadow)"/>
<!-- rear and front legs -->
<g stroke-linejoin="round" stroke-linecap="round">
 <path d="M430 520L370 575L340 675" fill="none" stroke="#283945" stroke-width="42"/><path d="M430 520L370 575L340 675" fill="none" stroke="url(#shell)" stroke-width="29"/>
