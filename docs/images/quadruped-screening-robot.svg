<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Sentinel — All-Terrain Inspection Robot Dog</title>
<desc id="desc">Original vector concept illustration of a deep navy and electric cyan four-legged industrial inspection robot dog, with articulated legs, four feet, front RGB and depth cameras, and a 360-degree lidar sensor, in an industrial port environment. Concept only; not a built or validated robot.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#12263c"/><stop offset="1" stop-color="#07111d"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#1c7894" stop-opacity=".48"/><stop offset="1" stop-color="#07111d" stop-opacity="0"/></radialGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#284762"/><stop offset=".38" stop-color="#10263d"/><stop offset="1" stop-color="#071421"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff7fb"/><stop offset=".35" stop-color="#8199aa"/><stop offset=".7" stop-color="#d6e2e9"/><stop offset="1" stop-color="#52697b"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#8bf1ff"/><stop offset=".5" stop-color="#25c8ee"/><stop offset="1" stop-color="#087da8"/></linearGradient>
