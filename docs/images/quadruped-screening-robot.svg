<!-- emergency stop -->
<rect x="723" y="376" width="45" height="23" rx="5" fill="#233744"/><circle cx="746" cy="376" r="12" fill="#e24d4d" stroke="#f7b6b6" stroke-width="3"/>
<!-- labels -->
<g font-family="Arial,Helvetica,sans-serif" fill="#203542">
 <rect x="48" y="42" width="480" height="100" rx="14" fill="#ffffff" opacity=".88"/>
 <text x="76" y="80" font-size="22" font-weight="700" letter-spacing="2">PUI89 • MOBILE SCREENING</text>
 <text x="76" y="112" font-size="17">Quadruped platform / concept architecture</text>
 <path d="M565 298L650 222H820" stroke="#0b8d91" stroke-width="3" fill="none"/><circle cx="565" cy="298" r="5" fill="#0b8d91"/>
 <rect x="815" y="188" width="280" height="72" rx="10" fill="#fff" opacity=".9"/>
 <text x="835" y="218" font-size="17" font-weight="700">360° navigation lidar</text><text x="835" y="241" font-size="14">Mapping • obstacle avoidance</text>
 <path d="M651 415L760 350H922" stroke="#0b8d91" stroke-width="3" fill="none"/><circle cx="651" cy="415" r="5" fill="#0b8d91"/>
 <rect x="918" y="311" width="325" height="76" rx="10" fill="#fff" opacity=".92"/>
 <text x="938" y="341" font-size="17" font-weight="700">Replaceable sensor bay</text><text x="938" y="365" font-size="14">Chemical sensor requires validation</text>
 <path d="M820 491L930 515H1080" stroke="#0b8d91" stroke-width="3" fill="none"/><circle cx="820" cy="491" r="5" fill="#0b8d91"/>
 <rect x="1076" y="485" width="275" height="75" rx="10" fill="#fff" opacity=".92"/>
 <text x="1096" y="515" font-size="17" font-weight="700">Low-speed patrol</text><text x="1096" y="539" font-size="14">Yield • stop • human override</text>
 <rect x="48" y="780" width="650" height="76" rx="12" fill="#fff" opacity=".9"/>
 <text x="72" y="811" font-size="17" font-weight="700">DESIGN STATUS: CONCEPT ONLY</text><text x="72" y="836" font-size="15">Not a built, tested, or validated screening robot.</text>
</g>
</svg>